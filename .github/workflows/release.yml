name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      runtime: ${{ steps.runtime.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: version
        name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The tag must look like v1.2.3, got '$TAG'."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - id: runtime
        name: Find the runtime version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          runtime="$VERSION"
          for tag in $(git tag --list 'v*' --sort=-v:refname); do
            if git diff --quiet "$tag" HEAD -- runtime external docker compose.yaml assets/switch; then
              runtime="${tag#v}"
            else
              break
            fi
          done
          echo "Runtime version: $runtime"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"

  runtime:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build the runtime
        run: |
          docker compose build runtime
          docker compose run --rm runtime

      - name: Build hacBrewPack
        run: docker compose run --rm hacbrewpack

      - name: Pack the runtime
        working-directory: app
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 run --release -p carafe-pack --example pack_runtime -- \
            crates/carafe-desktop/resources/runtime "$RUNNER_TEMP/carafe-runtime.bin"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime
          path: ${{ runner.temp }}/carafe-runtime.bin
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hacbrewpack
          path: app/crates/carafe-desktop/binaries/*.exe
          if-no-files-found: error
          retention-days: 7

  installer:
    needs: [prepare, runtime]
    environment: release
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            $url = if ('${{ matrix.arch }}' -eq 'arm64') { 'https://win.rustup.rs/aarch64' } else { 'https://win.rustup.rs/x86_64' }
            Invoke-WebRequest $url -OutFile $installer
            & $installer -y --default-toolchain none --profile minimal
            Add-Content $env:GITHUB_PATH (Join-Path $env:USERPROFILE '.cargo\bin')
            $env:PATH = (Join-Path $env:USERPROFILE '.cargo\bin') + ';' + $env:PATH
          }
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime
          path: app/crates/carafe-desktop/resources

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: hacbrewpack
          path: app/crates/carafe-desktop/binaries

      - name: Set the version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: sed -i "s/^version = \"0.0.0\"$/version = \"$VERSION\"/" Cargo.toml && grep -q "^version = \"$VERSION\"$" Cargo.toml

      - run: npm ci

      - name: Build the signed installer
        shell: bash
        env:
          CARAFE_RUNTIME_VERSION: ${{ needs.prepare.outputs.runtime }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri build --config crates/carafe-desktop/tauri.release.conf.json \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-${{ matrix.arch }}
          path: |
            app/target/release/bundle/nsis/*-setup.exe
            app/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: [prepare, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: Update manifest
        working-directory: dist
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RUNTIME: ${{ needs.prepare.outputs.runtime }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          entry() {
            local file="Carafe_${VERSION}_$1-setup.exe"
            if [ ! -s "$file" ] || [ ! -s "$file.sig" ]; then
              echo "::error::$file or its signature is missing."
              exit 1
            fi
            jq -n --arg url "$base/$file" --rawfile signature "$file.sig" --argjson size "$(stat -c %s "$file")" \
              '{url: $url, signature: ($signature | rtrimstr("\n")), size: $size}'
          }
          x64=$(entry x64)
          arm64=$(entry arm64)
          jq -n \
            --arg version "$VERSION" \
            --arg runtime "$RUNTIME" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson x64 "$x64" \
            --argjson arm64 "$arm64" \
            '{version: $version, runtime: $runtime, pub_date: $date, platforms: {
              "windows-x86_64": $x64, "windows-x86_64-nsis": $x64,
              "windows-aarch64": $arm64, "windows-aarch64-nsis": $arm64}}' > latest.json
          jq -e '.platforms | length == 4 and all(.[]; .signature != "" and .size > 0)' latest.json > /dev/null
          cat latest.json

      - name: Checksums
        working-directory: dist
        run: sha256sum *-setup.exe > SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*-setup.exe

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::A release or draft $TAG already exists. Delete the draft and run again."
            exit 1
          fi
          gh release create "$TAG" dist/*-setup.exe dist/latest.json dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Carafe $VERSION" \
            --generate-notes
