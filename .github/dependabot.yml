version: 2
updates:
  - package-ecosystem: cargo
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      tauri:
        patterns:
          - "tauri*"
      rust:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
      npm:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
