[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
carafe-core = { path = "crates/carafe-core" }
carafe-folder = { path = "crates/carafe-folder" }
carafe-images = { path = "crates/carafe-images" }
carafe-steamgriddb = { path = "crates/carafe-steamgriddb" }
carafe-keys = { path = "crates/carafe-keys" }
carafe-library = { path = "crates/carafe-library" }
carafe-mtp = { path = "crates/carafe-mtp" }
carafe-pack = { path = "crates/carafe-pack" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
flate2 = "1.1"
fs4 = "1.1"
thiserror = "2"
ts-rs = "12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package.sha2]
opt-level = 3
